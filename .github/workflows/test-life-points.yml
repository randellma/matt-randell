name: Test and Deploy Life Points

on:
  pull_request:
    paths:
      - life-points/**
      - .github/workflows/test-life-points.yml
  push:
    branches: [main]
    paths:
      - life-points/**
      - .github/workflows/test-life-points.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: life-points
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: life-points/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Acceptance test
        run: npm test
      - name: Production build
        run: npm run build
        env:
          VITE_POCKETBASE_URL: https://lifepoints-api.mattrandell.com
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npx wrangler pages deploy dist --project-name life-points-mattrandell --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 894ff489298bdf1ca445fc9469854b25
      - name: Production smoke test
        if: (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || github.event_name == 'workflow_dispatch'
        run: node acceptance/production-smoke.mjs
