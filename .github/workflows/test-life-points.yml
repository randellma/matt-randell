name: Test Life Points

on:
  pull_request:
    paths:
      - life-points/**
      - .github/workflows/test-life-points.yml
  push:
    branches: [main]
    paths:
      - life-points/**
      - .github/workflows/test-life-points.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: life-points
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: life-points/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
