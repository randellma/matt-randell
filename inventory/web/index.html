<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563EB" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Inventory" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <title>Inventory</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #2563EB;
      --blue-dark: #1d4ed8;
      --red: #dc2626;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--blue);
      color: white;
      min-height: 100dvh;
    }

    /* ── Secret gate ── */
    #gate {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      min-height: 100dvh;
      padding: 2rem;
    }
    #gate h1 { font-size: 1.75rem; font-weight: 700; }
    #gate p { opacity: 0.75; text-align: center; }
    #gate input {
      width: 100%;
      max-width: 22rem;
      padding: 0.75rem 1rem;
      border: 2px solid rgba(255,255,255,0.4);
      border-radius: 0.5rem;
      background: rgba(255,255,255,0.15);
      color: white;
      font-size: 1rem;
    }
    #gate input::placeholder { color: rgba(255,255,255,0.5); }
    #gate input:focus { outline: none; border-color: white; }

    /* ── Capture screen ── */
    #capture {
      display: none;
      flex-direction: column;
      gap: 1.25rem;
      padding: 2rem 1.5rem;
      max-width: 30rem;
      margin: 0 auto;
    }
    #capture h1 { font-size: 1.5rem; font-weight: 700; }

    .field { display: flex; flex-direction: column; gap: 0.4rem; }
    label { font-size: 0.875rem; opacity: 0.8; font-weight: 500; }

    input[type="text"], select {
      padding: 0.75rem 1rem;
      border: 2px solid rgba(255,255,255,0.35);
      border-radius: 0.5rem;
      background: rgba(255,255,255,0.15);
      color: white;
      font-size: 1rem;
    }
    input[type="text"]::placeholder { color: rgba(255,255,255,0.45); }
    input[type="text"]:focus, select:focus { outline: none; border-color: white; }
    select option { background: var(--blue-dark); color: white; }

    /* Photo preview */
    #photo-preview {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      border-radius: 0.75rem;
      border: 2px dashed rgba(255,255,255,0.4);
      display: none;
    }
    #photo-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      aspect-ratio: 4/3;
      border: 2px dashed rgba(255,255,255,0.4);
      border-radius: 0.75rem;
      cursor: pointer;
      font-size: 1rem;
      opacity: 0.8;
      transition: opacity 0.15s;
    }
    #photo-label:hover { opacity: 1; }
    #photo-input { display: none; }

    /* Buttons */
    .btn {
      padding: 0.875rem 1.5rem;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: white; color: var(--blue); }
    .btn-primary:hover:not(:disabled) { opacity: 0.9; }

    #capture-error {
      font-size: 0.875rem;
      text-align: center;
      color: #fca5a5;
    }

    /* ── Upload queue chips ── */
    #queue-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .queue-chip {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.5rem 0.75rem;
      border-radius: 0.5rem;
      background: rgba(255,255,255,0.12);
      font-size: 0.875rem;
      transition: background 0.2s;
    }
    .queue-chip.uploading { animation: chip-pulse 1.2s ease-in-out infinite; }
    .queue-chip.done    { background: rgba(52, 211, 153, 0.3); }
    .queue-chip.failed  { background: rgba(220, 38, 38, 0.3); cursor: pointer; }
    @keyframes chip-pulse {
      0%, 100% { background: rgba(255,255,255,0.18); }
      50%       { background: rgba(255,255,255,0.28); }
    }
    .chip-thumb {
      width: 2rem;
      height: 2rem;
      border-radius: 0.3rem;
      object-fit: cover;
      flex-shrink: 0;
      background: rgba(255,255,255,0.1);
    }
    .chip-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chip-retry { font-size: 0.75rem; opacity: 0.75; flex-shrink: 0; }
    .chip-indicator { flex-shrink: 0; }
    .spinner {
      display: inline-block;
      width: 0.85rem;
      height: 0.85rem;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Tab nav ── */
    #tab-nav {
      display: none;
      justify-content: center;
      gap: 0.5rem;
      padding: 1.25rem 1.5rem 0;
      max-width: 30rem;
      margin: 0 auto;
    }
    .tab {
      flex: 1;
      padding: 0.6rem 1rem;
      border: 2px solid rgba(255,255,255,0.4);
      border-radius: 0.5rem;
      background: transparent;
      color: white;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .tab:hover { background: rgba(255,255,255,0.1); }
    .tab.active { background: white; color: var(--blue); border-color: white; }

    /* ── Viewer screen ── */
    #viewer {
      display: none;
      flex-direction: column;
      gap: 0;
      padding: 1.25rem 1.5rem 2rem;
      max-width: 30rem;
      margin: 0 auto;
    }
    #viewer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 2.5rem;
      padding: 0.25rem 0;
    }
    #viewer-status {
      font-size: 0.875rem;
      opacity: 0.75;
    }
    .btn-icon {
      background: transparent;
      border: none;
      color: white;
      font-size: 1.25rem;
      cursor: pointer;
      opacity: 0.7;
      padding: 0.25rem 0.5rem;
      border-radius: 0.5rem;
      line-height: 1;
      transition: opacity 0.15s;
    }
    .btn-icon:hover { opacity: 1; }
    #item-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .item-card {
      display: flex;
      gap: 0.75rem;
      background: rgba(255,255,255,0.12);
      border-radius: 0.75rem;
      padding: 0.75rem;
      align-items: flex-start;
    }
    .item-thumb {
      width: 4rem;
      height: 4rem;
      object-fit: cover;
      border-radius: 0.5rem;
      flex-shrink: 0;
      background: rgba(255,255,255,0.1);
    }
    .item-thumb-placeholder {
      width: 4rem;
      height: 4rem;
      border-radius: 0.5rem;
      flex-shrink: 0;
      background: rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }
    .item-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.2rem; }
    .item-name { font-weight: 600; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-meta { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
    .badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.15rem 0.45rem;
      border-radius: 0.3rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .badge-captured { background: rgba(255,255,255,0.2); color: white; }
    .badge-reviewed { background: #fbbf24; color: #1f2937; }
    .badge-handled  { background: #34d399; color: #1f2937; }
    .item-disposition { font-size: 0.8rem; opacity: 0.8; }
    .item-notes { font-size: 0.8rem; opacity: 0.7; font-style: italic; margin-top: 0.15rem; }
    .item-card { cursor: pointer; transition: background 0.15s; }
    .item-card:hover { background: rgba(255,255,255,0.18); }

    /* ── Item detail modal ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 100;
    }
    .modal-overlay[hidden] { display: none; }
    .modal-card {
      position: relative; width: 100%; max-width: 30rem;
      background: #1e3a8a; border-radius: 1rem 1rem 0 0;
      padding: 1.5rem 1.25rem 2.5rem;
      display: flex; flex-direction: column; gap: 0.75rem;
      max-height: 92dvh; overflow-y: auto;
    }
    .modal-close { position: absolute; top: 0.75rem; right: 0.75rem; font-size: 1.1rem; }
    .modal-img { width: 100%; aspect-ratio: 4/3; object-fit: contain; border-radius: 0.75rem; background: rgba(255,255,255,0.08); }
    .modal-body { display: flex; flex-direction: column; gap: 0.6rem; }
    .modal-name { font-weight: 700; font-size: 1.1rem; }
    .modal-meta { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .modal-notes-input {
      padding: 0.65rem 0.9rem; border: 2px solid rgba(255,255,255,0.3);
      border-radius: 0.5rem; background: rgba(255,255,255,0.12);
      color: white; font-size: 0.95rem; width: 100%; resize: vertical;
      min-height: 4rem; font-family: inherit;
    }
    .modal-notes-input::placeholder { color: rgba(255,255,255,0.45); }
    .modal-notes-input:focus { outline: none; border-color: white; }
    .modal-section { display: flex; flex-direction: column; gap: 0.35rem; }
    .modal-label { font-size: 0.8rem; opacity: 0.7; font-weight: 500; }
    .modal-select {
      padding: 0.65rem 0.9rem; border: 2px solid rgba(255,255,255,0.3);
      border-radius: 0.5rem; background: rgba(255,255,255,0.12);
      color: white; font-size: 0.95rem; width: 100%;
    }
    .modal-select option { background: #1d4ed8; color: white; }
    .modal-action-btn { width: 100%; margin-top: 0.25rem; }
    .btn-secondary { background: rgba(255,255,255,0.18); color: white; }
    .btn-secondary:hover:not(:disabled) { background: rgba(255,255,255,0.25); }
    .btn-danger { background: var(--red); color: white; }
    .btn-danger:hover:not(:disabled) { opacity: 0.85; }
    .modal-action-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .modal-error { font-size: 0.85rem; color: #fca5a5; text-align: center; margin-top: 0.25rem; }
  </style>
</head>
<body>

  <!-- Secret gate — shown on first load until secret is entered -->
  <div id="gate">
    <h1>Inventory</h1>
    <p>Enter the shared secret to get started.<br>It will be remembered on this device.</p>
    <input id="secret-input" type="password" placeholder="Shared secret" autocomplete="off" />
    <button class="btn btn-primary" id="secret-save">Save</button>
  </div>

  <!-- Tab nav — shown once secret is entered -->
  <div id="tab-nav">
    <button class="tab active" id="tab-capture">Capture</button>
    <button class="tab" id="tab-viewer">Viewer</button>
  </div>

  <!-- Capture screen — shown once secret is in localStorage -->
  <div id="capture">
    <h1>Capture</h1>

    <div class="field">
      <label for="photo-input">Photo</label>
      <label id="photo-label" for="photo-input">📷 Take or pick a photo</label>
      <input id="photo-input" type="file" accept="image/*" capture="environment" />
      <img id="photo-preview" alt="preview" />
    </div>

    <div class="field">
      <label for="name-input">Name</label>
      <input id="name-input" type="text" placeholder="e.g. Old blender" />
    </div>

    <div class="field">
      <label for="disposition-select">Disposition (optional)</label>
      <select id="disposition-select">
        <option value="">— not sure yet —</option>
        <option value="Sell">Sell</option>
        <option value="Give away">Give away</option>
        <option value="Donate">Donate</option>
        <option value="Junk">Junk</option>
        <option value="Store">Store</option>
      </select>
    </div>

    <button class="btn btn-primary" id="capture-btn">Capture</button>
    <div id="capture-error" hidden></div>
    <div id="queue-list"></div>
  </div>

  <!-- Viewer screen -->
  <div id="viewer">
    <div id="viewer-header">
      <span id="viewer-status"></span>
      <button class="btn-icon" id="refresh-btn" title="Refresh">↻</button>
    </div>
    <div id="item-list"></div>
  </div>

  <!-- Item detail modal -->
  <div id="item-modal" class="modal-overlay" hidden>
    <div class="modal-card">
      <button class="modal-close btn-icon" id="modal-close" aria-label="Close">✕</button>
      <img id="modal-img" class="modal-img" alt="" />
      <div class="modal-body">
        <div class="modal-name" id="modal-name"></div>
        <div class="modal-meta" id="modal-meta"></div>
        <div class="modal-section">
          <label class="modal-label" for="modal-notes">Notes</label>
          <textarea id="modal-notes" class="modal-notes-input" placeholder="Add notes…" rows="3"></textarea>
        </div>
        <button class="btn btn-secondary modal-action-btn" id="modal-save-notes">Save notes</button>
        <div class="modal-section">
          <label class="modal-label" for="modal-disposition">Disposition</label>
          <select id="modal-disposition" class="modal-select">
            <option value="">— not sure yet —</option>
            <option value="Sell">Sell</option>
            <option value="Give away">Give away</option>
            <option value="Donate">Donate</option>
            <option value="Junk">Junk</option>
            <option value="Store">Store</option>
          </select>
        </div>
        <button class="btn btn-primary modal-action-btn" id="modal-save-disposition">Save disposition</button>
        <button class="btn btn-secondary modal-action-btn" id="modal-mark-handled">Mark as handled</button>
        <button class="btn btn-danger modal-action-btn" id="modal-delete">Delete item</button>
        <div class="modal-error" id="modal-error" hidden></div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
