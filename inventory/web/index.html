<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563EB" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Inventory" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <title>Inventory</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #2563EB;
      --blue-dark: #1d4ed8;
      --red: #dc2626;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--blue);
      color: white;
      min-height: 100dvh;
    }

    /* ── Secret gate ── */
    #gate {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      min-height: 100dvh;
      padding: 2rem;
    }
    #gate h1 { font-size: 1.75rem; font-weight: 700; }
    #gate p { opacity: 0.75; text-align: center; }
    #gate input {
      width: 100%;
      max-width: 22rem;
      padding: 0.75rem 1rem;
      border: 2px solid rgba(255,255,255,0.4);
      border-radius: 0.5rem;
      background: rgba(255,255,255,0.15);
      color: white;
      font-size: 1rem;
    }
    #gate input::placeholder { color: rgba(255,255,255,0.5); }
    #gate input:focus { outline: none; border-color: white; }

    /* ── Capture screen ── */
    #capture {
      display: none;
      flex-direction: column;
      gap: 1.25rem;
      padding: 2rem 1.5rem;
      max-width: 30rem;
      margin: 0 auto;
    }
    #capture h1 { font-size: 1.5rem; font-weight: 700; }

    .field { display: flex; flex-direction: column; gap: 0.4rem; }
    label { font-size: 0.875rem; opacity: 0.8; font-weight: 500; }

    input[type="text"], select {
      padding: 0.75rem 1rem;
      border: 2px solid rgba(255,255,255,0.35);
      border-radius: 0.5rem;
      background: rgba(255,255,255,0.15);
      color: white;
      font-size: 1rem;
    }
    input[type="text"]::placeholder { color: rgba(255,255,255,0.45); }
    input[type="text"]:focus, select:focus { outline: none; border-color: white; }
    select option { background: var(--blue-dark); color: white; }

    /* Photo preview */
    #photo-preview {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      border-radius: 0.75rem;
      border: 2px dashed rgba(255,255,255,0.4);
      display: none;
    }
    #photo-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      aspect-ratio: 4/3;
      border: 2px dashed rgba(255,255,255,0.4);
      border-radius: 0.75rem;
      cursor: pointer;
      font-size: 1rem;
      opacity: 0.8;
      transition: opacity 0.15s;
    }
    #photo-label:hover { opacity: 1; }
    #photo-input { display: none; }

    /* Buttons */
    .btn {
      padding: 0.875rem 1.5rem;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: white; color: var(--blue); }
    .btn-primary:hover:not(:disabled) { opacity: 0.9; }

    #status {
      font-size: 0.875rem;
      min-height: 1.25rem;
      text-align: center;
    }
    #status.error { color: #fca5a5; }
    #status.success { color: #86efac; }

    /* ── Tab nav ── */
    #tab-nav {
      display: none;
      justify-content: center;
      gap: 0.5rem;
      padding: 1.25rem 1.5rem 0;
      max-width: 30rem;
      margin: 0 auto;
    }
    .tab {
      flex: 1;
      padding: 0.6rem 1rem;
      border: 2px solid rgba(255,255,255,0.4);
      border-radius: 0.5rem;
      background: transparent;
      color: white;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .tab:hover { background: rgba(255,255,255,0.1); }
    .tab.active { background: white; color: var(--blue); border-color: white; }

    /* ── Viewer screen ── */
    #viewer {
      display: none;
      flex-direction: column;
      gap: 0;
      padding: 1.25rem 1.5rem 2rem;
      max-width: 30rem;
      margin: 0 auto;
    }
    #viewer-status {
      font-size: 0.875rem;
      opacity: 0.75;
      text-align: center;
      padding: 1rem 0;
    }
    #item-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .item-card {
      display: flex;
      gap: 0.75rem;
      background: rgba(255,255,255,0.12);
      border-radius: 0.75rem;
      padding: 0.75rem;
      align-items: flex-start;
    }
    .item-thumb {
      width: 4rem;
      height: 4rem;
      object-fit: cover;
      border-radius: 0.5rem;
      flex-shrink: 0;
      background: rgba(255,255,255,0.1);
    }
    .item-thumb-placeholder {
      width: 4rem;
      height: 4rem;
      border-radius: 0.5rem;
      flex-shrink: 0;
      background: rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }
    .item-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.2rem; }
    .item-name { font-weight: 600; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-meta { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
    .badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.15rem 0.45rem;
      border-radius: 0.3rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .badge-captured { background: rgba(255,255,255,0.2); color: white; }
    .badge-reviewed { background: #fbbf24; color: #1f2937; }
    .badge-handled  { background: #34d399; color: #1f2937; }
    .item-disposition { font-size: 0.8rem; opacity: 0.8; }
    .item-notes { font-size: 0.8rem; opacity: 0.7; font-style: italic; margin-top: 0.15rem; }
  </style>
</head>
<body>

  <!-- Secret gate — shown on first load until secret is entered -->
  <div id="gate">
    <h1>Inventory</h1>
    <p>Enter the shared secret to get started.<br>It will be remembered on this device.</p>
    <input id="secret-input" type="password" placeholder="Shared secret" autocomplete="off" />
    <button class="btn btn-primary" id="secret-save">Save</button>
  </div>

  <!-- Tab nav — shown once secret is entered -->
  <div id="tab-nav">
    <button class="tab active" id="tab-capture">Capture</button>
    <button class="tab" id="tab-viewer">Viewer</button>
  </div>

  <!-- Capture screen — shown once secret is in localStorage -->
  <div id="capture">
    <h1>Capture</h1>

    <div class="field">
      <label for="photo-input">Photo</label>
      <label id="photo-label" for="photo-input">📷 Take or pick a photo</label>
      <input id="photo-input" type="file" accept="image/*" capture="environment" />
      <img id="photo-preview" alt="preview" />
    </div>

    <div class="field">
      <label for="name-input">Name</label>
      <input id="name-input" type="text" placeholder="e.g. Old blender" />
    </div>

    <div class="field">
      <label for="disposition-select">Disposition (optional)</label>
      <select id="disposition-select">
        <option value="">— not sure yet —</option>
        <option value="Sell">Sell</option>
        <option value="Give away">Give away</option>
        <option value="Donate">Donate</option>
        <option value="Junk">Junk</option>
      </select>
    </div>

    <button class="btn btn-primary" id="capture-btn">Capture</button>
    <div id="status"></div>
  </div>

  <!-- Viewer screen -->
  <div id="viewer">
    <div id="viewer-status"></div>
    <div id="item-list"></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
