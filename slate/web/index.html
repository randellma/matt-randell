<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF6EC" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Slate" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <!-- og:start — group share links (/g/:id/:t) get this block rewritten per-group by functions/g/[[route]].js -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Slate" />
  <meta property="og:title" content="Slate — split expenses with friends" />
  <meta property="og:description" content="Track shared expenses and settle up fairly. No app to install, no accounts — a group is just a link." />
  <meta property="og:image" content="https://slate.mattrandell.com/og-card.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <!-- og:end -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Alegreya+Sans:wght@400;500;700;800&display=swap"
    rel="stylesheet"
  />
  <title>Slate</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }
    // Native-app feel: block iOS Safari's pinch-to-zoom. The viewport meta's
    // user-scalable=no is ignored on modern iOS, so cancel the gesture events
    // (a WebKit-only API) directly. Double-tap zoom is handled by touch-action
    // in the stylesheet.
    for (const evt of ['gesturestart', 'gesturechange', 'gestureend']) {
      document.addEventListener(evt, e => e.preventDefault(), { passive: false });
    }
  </script>
</body>
</html>
